name: Metro original startup dependency evidence
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/metro_import_contracts.py'
      - 'tests/test_metro_import_contracts.py'
      - '.github/workflows/metro-dependency-analysis.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rexglue/rexglue-sdk
          ref: a3e1d82678ca20d68d4837a8e9ee4652ff073745
          path: build/sdk-source
          sparse-checkout: src/kernel
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kyz/libmspack
          ref: 305907723a4e7ab2018e58040059ffb5e77db837
          path: build/mspack
          persist-credentials: false
      - name: Verify analysis and collect original-only dependency evidence
        run: |
          python -m unittest discover -s tests -p test_metro_import_contracts.py
          python tools/fetch_originals.py --only dash_basic --only pirs
          source=build/mspack/libmspack/mspack
          cc -shared -fPIC -O2 -I"$source" tools/lzx_adapter.c "$source/lzxd.c" -o build/lzx_adapter.so
          python tools/metro_import_contracts.py --sdk build/sdk-source --lzx build/lzx_adapter.so --output build/receipts/metro-import-contracts.json
      - uses: actions/upload-artifact@v4
        with:
          name: metro-import-contracts
          path: build/receipts/metro-import-contracts.json
          if-no-files-found: error
