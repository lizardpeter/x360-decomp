name: Reconstruction validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      original_audit:
        description: Verify pinned originals and regenerate metadata
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/status.py
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --parallel
      - run: ctest --test-dir build/native --output-on-failure
      - run: python tools/fetch_originals.py --only dash_basic
      - run: python tools/verify_native_leaf.py
      - run: python tools/verify_xui_resources.py build/native/x360_resource_probe
      - name: Build pinned original LZX source adapter and audit system resources
        run: |
          mkdir -p build/reference
          curl --fail --location --retry 3 -o build/reference/release.tar.gz https://github.com/fabegalo/x360-native/releases/download/v1.34.6/x360-native-1.34.6-linux-x64.tar.gz
          echo "df30bd537923a3f2c78637699c2d9f97fd50c78a6cc28a435e922c54512f2fb3  build/reference/release.tar.gz" | sha256sum -c
          tar -xzf build/reference/release.tar.gz -C build/reference x360-native-1.34.6-linux-x64/app/workspace/licenses/sources/libmspack
          SOURCE="$PWD/build/reference/x360-native-1.34.6-linux-x64/app/workspace/licenses/sources/libmspack"
          cc -shared -fPIC -O2 -I"$SOURCE" tools/lzx_adapter.c "$SOURCE/lzxd.c" -o build/lzx_adapter.so
          python tools/fetch_originals.py --only pirs
          python tools/verify_xui_resources.py build/native/x360_resource_probe --system --lzx build/lzx_adapter.so
          python tools/verify_module_loading.py build/native/x360_module_probe --lzx build/lzx_adapter.so
          python tools/fetch_originals.py --only shared_resources
          python tools/verify_textures.py build/native/x360_texture_probe --lzx build/lzx_adapter.so
  original-audit:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.original_audit) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[original-audit]')))
    needs: formats
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify originals and regenerate metadata
        run: |
          python tools/fetch_originals.py
          python tools/analyze.py
          python tools/status.py
      - name: Upload generated analysis only
        uses: actions/upload-artifact@v4
        with:
          name: metro-17559-analysis
          path: |
            analysis/
            STATUS.md
          retention-days: 14
      - name: Commit generated metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- analysis/ STATUS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate verified Metro 17559 header analysis"
          git push origin HEAD:main
