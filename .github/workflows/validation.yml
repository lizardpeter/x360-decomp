name: Reconstruction validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      original_audit:
        description: Verify pinned originals and publish metadata only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/status.py
      - name: Verify original sources and regenerate metadata
        if: inputs.original_audit == true
        run: |
          python tools/fetch_originals.py
          python tools/analyze.py
          python tools/status.py
      - name: Upload generated analysis only
        if: inputs.original_audit == true
        uses: actions/upload-artifact@v4
        with:
          name: metro-17559-analysis
          path: |
            analysis/
            STATUS.md
          retention-days: 14
