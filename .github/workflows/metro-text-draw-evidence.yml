name: Metro original text draw and glyph call paths
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/metro_text_draw_evidence.py'
      - 'tools/metro_header_resource_evidence.py'
      - 'tools/metro_xui_text_twins.py'
      - 'tools/instrument_metro_ui.py'
      - 'tests/test_metro_xui_text_twins.py'
      - 'tests/test_metro_header_resource_evidence.py'
      - 'tests/test_metro_text_draw_evidence.py'
      - '.github/workflows/metro-text-draw-evidence.yml'
permissions:
  contents: read
jobs:
  original-hardware-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rexglue/rexglue-sdk
          ref: a3e1d82678ca20d68d4837a8e9ee4652ff073745
          path: build/sdk-source
          sparse-checkout: src/kernel
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kyz/libmspack
          ref: 305907723a4e7ab2018e58040059ffb5e77db837
          path: build/mspack
          persist-credentials: false
      - name: Trace original text, glyph and XTTF parser call paths
        run: |
          python -m unittest discover -s tests -p test_metro_text_draw_evidence.py
          python tools/fetch_originals.py --only pirs --only dash_basic
          source=build/mspack/libmspack/mspack
          cc -shared -fPIC -O2 -I"$source" tools/lzx_adapter.c "$source/lzxd.c" -o build/lzx_adapter.so
          python tools/metro_text_draw_evidence.py --sdk build/sdk-source --lzx build/lzx_adapter.so --output build/receipts/metro-text-draw-evidence.json
          python -m unittest discover -s tests -p test_metro_header_resource_evidence.py
          python tools/metro_header_resource_evidence.py --lzx build/lzx_adapter.so --output build/receipts/metro-header-resource-evidence.json
          python -m unittest discover -s tests -p test_metro_xui_text_twins.py
          python tools/metro_xui_text_twins.py --lzx build/lzx_adapter.so --output build/receipts/metro-xui-text-twins.json
      - uses: actions/upload-artifact@v4
        with:
          name: metro-text-draw-evidence
          path: |
            build/receipts/metro-text-draw-evidence.json
            build/receipts/metro-header-resource-evidence.json
            build/receipts/metro-xui-text-twins.json
          if-no-files-found: error
