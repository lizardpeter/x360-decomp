name: Ghidra PowerPC analysis
on:
  push:
    branches: [main]
    paths: ['tools/ghidra/**', '.github/workflows/ghidra.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        module: [dash_17559, xam_17559]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Obtain pinned Ghidra and LZX decoder
        run: |
          mkdir -p build/reference
          curl --fail --location --retry 3 -o build/reference/ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  build/reference/ghidra.zip" | sha256sum -c
          unzip -q build/reference/ghidra.zip -d build/reference
          curl --fail --location --retry 3 -o build/reference/release.tar.gz https://github.com/fabegalo/x360-native/releases/download/v1.34.6/x360-native-1.34.6-linux-x64.tar.gz
          echo "df30bd537923a3f2c78637699c2d9f97fd50c78a6cc28a435e922c54512f2fb3  build/reference/release.tar.gz" | sha256sum -c
          tar -xzf build/reference/release.tar.gz -C build/reference
          APP="$PWD/build/reference/x360-native-1.34.6-linux-x64/app"
          cc -shared -fPIC -O2 -I"$APP/workspace/licenses/sources/libmspack" tools/lzx_adapter.c -L"$APP" -lx360n-mspack -Wl,-rpath,"$APP" -o build/lzx_adapter.so
      - name: Verify and decode originals
        run: |
          python tools/fetch_originals.py
          python tools/analyze_decoded.py --lzx build/lzx_adapter.so
      - name: Analyze all discovered functions
        run: bash tools/ghidra/run.sh build/reference/ghidra_12.2_PUBLIC ${{ matrix.module }}
      - name: Upload analysis census and diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-${{ matrix.module }}-inventory
          path: |
            build/ghidra/${{ matrix.module }}/export/summary.json
            build/ghidra/${{ matrix.module }}/export/functions.tsv
            build/ghidra/${{ matrix.module }}/export/decompile_errors.tsv
            build/ghidra/${{ matrix.module }}/export/missing_seeds.tsv
            build/ghidra/${{ matrix.module }}/export/*candidates.tsv
            build/ghidra/${{ matrix.module }}/export/seed_reconciliation.tsv
            build/ghidra/${{ matrix.module }}/export/reconcile_receipt.json
            build/ghidra/${{ matrix.module }}/auto_receipt.json
            build/ghidra/${{ matrix.module }}/reconcile.log
            build/ghidra/${{ matrix.module }}/reconcile-scripts.log
            build/ghidra/${{ matrix.module }}/seed_receipt.json
            build/ghidra/${{ matrix.module }}/headless.log
            build/ghidra/${{ matrix.module }}/scripts.log
          if-no-files-found: warn
          retention-days: 30
