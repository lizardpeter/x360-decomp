name: Metro integrated original profile module runtime
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/verify_metro_profile_generated.py'
      - 'tools/native/metro_profile_mapping.hpp'
      - '.github/workflows/metro-profile-integrated.yml'
permissions:
  contents: read
jobs:
  integrated:
    uses: ./.github/workflows/aot-fixed-imports.yml
    with:
      profile_modules: true
