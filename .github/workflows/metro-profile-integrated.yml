name: Metro integrated original profile module runtime
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/verify_metro_profile_generated.py'
      - 'tools/instrument_metro_profile.py'
      - 'tools/capture_metro_boot.sh'
      - 'tools/stage_metro_profile_modules.py'
      - 'tools/patch_metro_retail_routing.py'
      - 'tools/native/metro_profile_mapping.hpp'
      - 'tools/patch_metro_public_verification.py'
      - '.github/workflows/metro-profile-integrated.yml'
permissions:
  contents: read
jobs:
  integrated:
    uses: ./.github/workflows/aot-fixed-imports.yml
    with:
      profile_modules: true
