      - 'tests/sdk/metro_scalar_codegen.cpp'
      - 'tests/sdk/metro_gpu_ring.cpp'
      - 'tools/instrument_metro_ui.py'
      - 'tools/metro_720p_text_probe.py'
      - 'tools/compare_metro_text_paths.py'
      - 'tests/test_compare_metro_text_paths.py'
      - '.github/workflows/aot-fixed-imports.yml'
      - '.github/workflows/metro-profile-integrated.yml'
